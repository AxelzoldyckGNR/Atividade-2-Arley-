<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão do Tempo - BrasilAPI</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <main>
      <section class="painel">
        <header class="cabecalho">
          <span class="icone-clima">🔆</span>
          <!--Icone-->
          <div>
            <p class="subtitulo">Previsão do Tempo</p>
            <h1 class="titulo">Como está o clima?</h1>
          </div>
        </header>
        <div class="busca">
          <label for="cidade">Busque uma cidade brasileira</label>
          <div class="campo-busca">
            <span>🔎︎</span>
            <!--Icone-->
            <input
              id="cidade"
              type="text"
              placeholder="Ex.: Jacareí"
              autocomplete="off"
            />
          </div>
          <small>Digite o nome da cidade</small>
        </div>
        <p id="mensagem"></p>
        <div id="cidades"></div>
        <div id="previsao"></div>
      </section>
    </main>

    <script src="/js/index.js"></script>
  </body>
</html>
